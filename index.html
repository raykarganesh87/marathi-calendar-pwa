<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marathi Panchang Calendar Maker</title>
<meta name="description" content="Create a complete Marathi panchang calendar PDF for any year – tithi, nakshatra, festivals, vratas, sunrise/sunset – with ad space.">
<meta name="theme-color" content="#7a1f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panchang">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-head">
  <img src="icons/icon-192.png" alt="">
  <h1>Marathi Panchang Calendar Maker<small>मराठी पंचांग दिनदर्शिका – कोणत्याही वर्षाची</small></h1>
</header>

<main class="ui">
  <section class="card">
    <h2>1. Year and place</h2>
    <div class="grid2">
      <div><label for="year">Year (1900 – 2100)</label><input id="year" type="number" inputmode="numeric" min="1900" max="2100"></div>
      <div><label for="place">Place (for sunrise / sunset / moonrise)</label><select id="place"></select></div>
    </div>
    <div id="custom" class="grid4 hidden" style="margin-top:10px">
      <div style="grid-column: span 2"><label for="cname">Place name (Marathi)</label><input id="cname" placeholder="उदा. जळगाव"></div>
      <div><label for="clat">Latitude</label><input id="clat" type="number" step="0.0001" value="19.9975"></div>
      <div><label for="clon">Longitude</label><input id="clon" type="number" step="0.0001" value="73.7898"></div>
    </div>
  </section>

  <section class="card">
    <h2>2. Advertisement space (mm) &nbsp;<span class="hint">0 = no ad box</span></h2>
    <div class="grid4">
      <div><label for="gt">Month pages – top</label><input id="gt" type="number" min="0" max="80" value="28"></div>
      <div><label for="gb">Month pages – bottom</label><input id="gb" type="number" min="0" max="80" value="28"></div>
      <div><label for="ot">Other pages – top</label><input id="ot" type="number" min="0" max="80" value="20"></div>
      <div><label for="ob">Other pages – bottom</label><input id="ob" type="number" min="0" max="80" value="20"></div>
    </div>
  </section>

  <section class="card">
    <h2>3. Create</h2>
    <div class="btns">
      <button id="go" class="primary">Create calendar</button>
      <button id="print" class="accent hidden">Save as PDF / Print</button>
      <button id="install" class="ghost hidden">Install app</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="status">Ready.</div>
    <p class="hint" id="pdfhint"></p>
  </section>
</main>

<div id="stage" aria-label="Calendar preview"></div>

<script src="places.js"></script>
<script src="data.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
